{% extends 'HR_admin/base_bar.html' %}
{% load static %}

{% block title %}Add Increment{% endblock %}

{% block content %}
<div class="page-header d-print-none">
  <h4 class="fw-bold mb-3">Add Increment Form</h4>
</div>
<div class="row">
  <div class="col-sm-12 col-md-12">
    <div class="card card-stats card-round">
      <div class="card-header d-print-none text-start">
        <a id="backBtn" href="/hr/employee-increment-history/"><button class="btn btn-black btn-sm"><strong><i class="ri-arrow-left-circle-line"></i> Back</strong></button></a>
      </div>
      <div class="card-body">
        <div class="row">
          <h5><strong>Employee Details</strong></h5>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="employeeName">Employee Name</label>
              <input type="text" class="form-control" id="employeeName" value="" readonly>
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="employeeCode">Employee Code</label>
              <input type="text" class="form-control" id="employeeCode" value="" readonly>
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="employeeDepartment">Department</label>
              <select class="form-select" id="employeeDepartment" disabled>
                <option value="">-</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="deputedProject">Deputed Project</label>
              <select class="form-select" id="deputedProject" name="deputedProject" disabled>
                <option value="">-</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="employeeDesignation">Present Designation</label>
              <input type="text" class="form-control" id="employeeDesignation" Value="" readonly>   
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="doj">Date of Joining</label>
              <input type="date" class="form-control" id="doj" value="" readonly>   
            </div>
          </div>   
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="contactNumber1">Contact Number</label>
              <input type="text" id="contactNumber1" name="contactNumber1" class="form-control" maxlength="10" value="" readonly>
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="emailId">Email ID</label>
              <input type="email" id="emailId" name="emailId" class="form-control" value="" readonly>
            </div>
          </div>                   
        </div>
        <div class="row">
          <h5 class="mt-2"><strong>Increment Details</strong></h5>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="incrementDate">Increment Date<span class="text-danger">*</span></label>
              <input type="Date" class="form-control" id="incrementDate" name="incrementDate" required>   
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="incrementType">Increment Type<span class="text-danger">*</span></label>
              <select class="form-select" id="incrementType" name="incrementType" required="">
                <option value="">Select Increment Type</option>
                <option value="Promotion">Promotion</option>
                <option value="Performance">Performance</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="payLevel">Present Pay Level<span class="text-danger">*</span></label>
              <select class="form-select" id="payLevel" name="payLevel" required>
                <option value="">Select Pay Level</option>
                <option value="L1">L1</option>
                <option value="L2">L2</option>
                <option value="L3">L3</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="previousBasicPay">Previous Monthly CTC</label>
              <input type="number" class="form-control" id="previousBasicPay" name="previousBasicPay" value="" step="0.01" min="0" placeholder="Auto-filled from salary structure">
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="incrementAmount">Increment Amount<span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="incrementAmount" name="incrementAmount" value="" step="0.01" min="0">
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="basicPay">New Monthly CTC</label>
              <input type="number" class="form-control" id="basicPay" name="basicPay" required step="0.01" min="0" placeholder="Auto-calculated">
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="lwd">Effective Date From<span class="text-danger">*</span></label>
              <input type="Date" class="form-control" id="effDate" name="effDate" required>   
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="approvedBy">Approved By<span class="text-danger">*</span></label>
              <select class="form-select" id="approvedBy" name="approvedBy" required>
                <option value="">Select Approved By</option>
                <option value="Administration">Administration</option>
                <option value="HR Management">HR Management</option>
                <option value="Finance Management">Finance Management</option>
                <option value="Sales Management">Sales Management</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="othersRemark">Remark (Optional)</label>
              <textarea id="othersRemark" name="othersRemark" class="form-control" rows="3" cols="20" placeholder="Enter Remark"></textarea>
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="DocUpload">Document Upload (optional)</label>
              <input type="file" class="form-control" id="DocUpload" name="DocUpload">
            </div>
          </div>
          
        </div>
        <div class="mt-2">
          <div class="col-12 py-3 px-3 text-center">
            <button type="button" class="btn btn-success btn-sm" name="submit" id="submit"> Submit</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  async function loadEmployeeForForm() {
    const urlParams = new URLSearchParams(window.location.search);
    const targetCode = urlParams.get('emp') || urlParams.get('code') || urlParams.get('id');

    if (targetCode && document.getElementById('backBtn')) {
      document.getElementById('backBtn').href = '/hr/employee-increment-history/?emp=' + targetCode;
    }

    const token = localStorage.getItem('authToken');
    const headers = token ? { 'Authorization': 'Token ' + token } : {};

    try {
      let url = '/api/accounts/employees/';
      let allEmp = [];

      while (url) {
        const res = await fetch(url, { headers });
        if (!res.ok) break;
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.results || []);
        allEmp = allEmp.concat(list);
        url = Array.isArray(data) ? null : data.next;
      }

      if (targetCode) {
        const found = allEmp.find(e => 
          (e.user_id && e.user_id.toLowerCase() === targetCode.toLowerCase()) ||
          (e.id && String(e.id) === String(targetCode))
        );
        if (found) {
          populateEmpFields(found);
        }
      } else if (allEmp.length > 0) {
        populateEmpFields(allEmp[0]);
      }
    } catch (err) {
      console.error('Error fetching employee details:', err);
    }
  }

  function populateEmpFields(emp) {
    const profile = emp.employee_profile || {};
    const employment = emp.employment_details || {};

    const firstName = (emp.first_name || '').trim();
    const lastName = (emp.last_name || '').trim();
    const fullName = [firstName, lastName].filter(Boolean).join(' ').toUpperCase() || emp.user_id || '-';

    if (document.getElementById('employeeName')) {
      document.getElementById('employeeName').value = fullName;
    }
    if (document.getElementById('employeeCode')) {
      document.getElementById('employeeCode').value = emp.user_id || '-';
    }
    if (document.getElementById('employeeDepartment')) {
      const deptSelect = document.getElementById('employeeDepartment');
      const deptVal = employment.department || '';
      deptSelect.innerHTML = `<option value="${deptVal}">${deptVal || '-'}</option>`;
    }
    if (document.getElementById('deputedProject')) {
      const projSelect = document.getElementById('deputedProject');
      const projVal = employment.deputed_project || '';
      projSelect.innerHTML = `<option value="${projVal}">${projVal || '-'}</option>`;
    }
    if (document.getElementById('employeeDesignation')) {
      document.getElementById('employeeDesignation').value = employment.designation || '-';
    }
    if (document.getElementById('doj')) {
      const dateVal = profile.date_of_joining || (emp.created_at ? emp.created_at.split('T')[0] : '');
      document.getElementById('doj').value = dateVal;
    }
    if (document.getElementById('contactNumber1')) {
      document.getElementById('contactNumber1').value = profile.contact_number || '-';
    }
    if (document.getElementById('emailId')) {
      document.getElementById('emailId').value = emp.email || profile.official_email || '-';
    }

    // ── Present Pay Level: from employment grade_level ────────────────────────
    const payLevelSel = document.getElementById('payLevel');
    const gradeLevel  = employment.grade_level;   // {id, name, ctc_range, ...}
    const gradeName   = gradeLevel ? gradeLevel.name : (employment.grade || '');
    if (payLevelSel && gradeName) {
      // Try matching existing option
      let matched = false;
      for (let i = 0; i < payLevelSel.options.length; i++) {
        if (payLevelSel.options[i].value === gradeName) {
          payLevelSel.value = gradeName;
          matched = true;
          break;
        }
      }
      // If no match, inject an option so value is preserved
      if (!matched) {
        const opt = document.createElement('option');
        opt.value = gradeName;
        opt.textContent = gradeName + (gradeLevel && gradeLevel.ctc_range ? ' (' + gradeLevel.ctc_range + ')' : '');
        payLevelSel.insertBefore(opt, payLevelSel.options[1] || null);
        payLevelSel.value = gradeName;
      }
    }

    // ── Previous Monthly CTC: from active SalaryStructure ────────────────────
    const token = localStorage.getItem('authToken');
    if (emp.id && token) {
      fetch('/api/payroll/salary-structures/?employee=' + emp.id, {
        headers: { 'Authorization': 'Token ' + token }
      }).then(r => r.ok ? r.json() : []).then(data => {
        const list = Array.isArray(data) ? data : (data.results || []);
        if (list.length > 0) {
          const ctc = parseFloat(list[0].ctc_monthly || 0);
          if (ctc > 0) {
            document.getElementById('previousBasicPay').value = ctc.toFixed(2);
            recalcNewCTC();
          }
        }
      }).catch(() => {});
    }
  }

  // ── Auto-calculate New Monthly CTC when Increment Amount changes ─────────
  function recalcNewCTC() {
    const prev = parseFloat(document.getElementById('previousBasicPay').value) || 0;
    const inc  = parseFloat(document.getElementById('incrementAmount').value)  || 0;
    if (prev > 0 || inc > 0) {
      document.getElementById('basicPay').value = (prev + inc).toFixed(2);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('incrementAmount').addEventListener('input', recalcNewCTC);
    document.getElementById('previousBasicPay').addEventListener('input', recalcNewCTC);
  });

  $(document).ready(function() {
    loadEmployeeForForm();

    $('#submit').on('click', async function(e) {
      e.preventDefault();

      const token = localStorage.getItem('authToken');
      if (!token) {
        alert('Authentication required. Please login again.');
        return;
      }

      const employee_code = $('#employeeCode').val();
      const increment_date = $('#incrementDate').val();
      const increment_type = $('#incrementType').val();
      const pay_level = $('#payLevel').val();
      const previous_basic_pay = $('#previousBasicPay').val();
      const increment_amount = $('#incrementAmount').val();
      const new_basic_pay = $('#basicPay').val();
      const effective_date_from = $('#effDate').val();
      const approved_by = $('#approvedBy').val();
      const remark = $('#othersRemark').val();
      const fileInput = document.getElementById('DocUpload');

      if (!increment_date || !increment_type || !pay_level || !previous_basic_pay || !increment_amount || !new_basic_pay || !effective_date_from || !approved_by) {
        alert('Please fill in all required fields.');
        return;
      }

      const formData = new FormData();
      formData.append('employee_code', employee_code);
      formData.append('increment_date', increment_date);
      formData.append('increment_type', increment_type);
      formData.append('pay_level', pay_level);
      formData.append('previous_basic_pay', previous_basic_pay);
      formData.append('increment_amount', increment_amount);
      formData.append('new_basic_pay', new_basic_pay);
      formData.append('effective_date_from', effective_date_from);
      formData.append('approved_by', approved_by);
      if (remark) formData.append('remark', remark);
      if (fileInput && fileInput.files.length > 0) {
        formData.append('document', fileInput.files[0]);
      }

      try {
        const res = await fetch('/api/accounts/increments/', {
          method: 'POST',
          headers: {
            'Authorization': 'Token ' + token
          },
          body: formData
        });

        if (res.ok) {
          alert('Increment record saved successfully!');
          window.location.href = '/hr/employee-increment-history/?emp=' + employee_code;
        } else {
          const errorData = await res.json();
          alert('Failed to save increment record: ' + JSON.stringify(errorData));
        }
      } catch(err) {
        console.error(err);
        alert('An error occurred while saving the record.');
      }
    });
  });
</script>
{% endblock %}
