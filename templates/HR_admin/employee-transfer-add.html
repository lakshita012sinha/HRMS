{% extends 'HR_admin/base_bar.html' %}
{% load static %}

{% block title %}Add Transfer{% endblock %}

{% block content %}
<div class="page-header d-print-none">
  <h4 class="fw-bold mb-3">Add Transfer Form</h4>
</div>
<div class="row">
  <div class="col-sm-12 col-md-12">
    <div class="card card-stats card-round">
      <div class="card-header d-print-none text-start">
        <a id="backBtn" href="/hr/employee-transfer-history/"><button class="btn btn-black btn-sm"><strong><i class="ri-arrow-left-circle-line"></i> Back</strong></button></a>
      </div>
      <div class="card-body">
        <div class="row">
          <h5><strong>Employee Details</strong></h5>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="employeeName">Employee Name</label>
              <input type="text" class="form-control" id="employeeName" value="" readonly>
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="employeeCode">Employee Code</label>
              <input type="text" class="form-control" id="employeeCode" value="" readonly>
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="employeeDepartment">Department</label>
              <select class="form-select" id="employeeDepartment" disabled>
                <option value="">-</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="deputedProject">Deputed Project</label>
              <select class="form-select" id="deputedProject" name="deputedProject" disabled>
                <option value="">-</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="employeeDesignation">Present Designation</label>
              <input type="text" class="form-control" id="employeeDesignation" Value="" readonly>   
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="doj">Date of Joining</label>
              <input type="date" class="form-control" id="doj" value="" readonly>   
            </div>
          </div>   
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="contactNumber1">Contact Number</label>
              <input type="text" id="contactNumber1" name="contactNumber1" class="form-control" maxlength="10" value="" readonly>
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="emailId">Email ID</label>
              <input type="email" id="emailId" name="emailId" class="form-control" value="" readonly>
            </div>
          </div>                   
        </div>
        <div class="row">
          <h5 class="mt-2"><strong>Transfer Details</strong></h5>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="TransferDate">Transfer Date<span class="text-danger">*</span></label>
              <input type="Date" class="form-control" id="TransferDate" name="TransferDate" required>   
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="presentOffice">Present Office<span class="text-danger">*</span></label>
              <select class="form-select" id="presentOffice" name="presentOffice" required="">
                <option value="">Select Present Office</option>
                <option value="NAGAR NIGAM JAIPUR">NAGAR NIGAM JAIPUR</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="newOffice">New Office<span class="text-danger">*</span></label>
              <select class="form-select" id="newOffice" name="newOffice" required="">
                <option value="">Select Present Office</option>
                <option value="NAGAR NIGAM KOTA">NAGAR NIGAM KOTA</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="presentDepartment">Present Department<span class="text-danger">*</span></label>
              <select class="form-select" id="presentDepartment" name="presentDepartment" required>
                <option value="">Select Present Department</option>
                <option value="Rajsthan ULB">Rajsthan ULB</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="newDepartment">New Department<span class="text-danger">*</span></label>
              <select class="form-select" id="newDepartment" name="newDepartment" required>
                <option value="">Select New Department</option>
                <option value="Kota ULB">Kota ULB</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="presentZone">Present Zone<span class="text-danger">*</span></label>
              <select class="form-select" id="presentZone" name="presentZone" required>
                <option value="">Select Present Zone</option>
                <option value="Jaipur">Jaipur</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="newZone">New Zone<span class="text-danger">*</span></label>
              <select class="form-select" id="newZone" name="newZone" required>
                <option value="">Select New Department</option>
                <option value="Kota">Kota</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="relievingDate">Relieving Date<span class="text-danger">*</span></label>
              <input type="Date" class="form-control" id="relievingDate" name="relievingDate" required>   
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="effDate">Effective Date From<span class="text-danger">*</span></label>
              <input type="Date" class="form-control" id="effDate" name="effDate" required>   
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="approvedBy">Approved By<span class="text-danger">*</span></label>
              <select class="form-select" id="approvedBy" name="approvedBy" required>
                <option value="">Select Approved By</option>
                <option value="Administration">Administration</option>
                <option value="HR Management">HR Management</option>
                <option value="Finance Management">Finance Management</option>
                <option value="Sales Management">Sales Management</option>
              </select>    
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="othersRemark">Remark (Optional)</label>
              <textarea id="othersRemark" name="othersRemark" class="form-control" rows="3" cols="20" placeholder="Enter Remark"></textarea>
            </div>
          </div>
          <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group">
              <label for="DocUpload">Document Upload (optional)</label>
              <input type="file" class="form-control" id="DocUpload" name="DocUpload">
            </div>
          </div>
          
        </div>
        <div class="mt-2">
          <div class="col-12 py-3 px-3 text-center">
            <button type="button" class="btn btn-success btn-sm" name="submit" id="submit"> Submit</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  async function loadEmployeeForForm() {
    const urlParams = new URLSearchParams(window.location.search);
    const targetCode = urlParams.get('emp') || urlParams.get('code') || urlParams.get('id');

    if (targetCode && document.getElementById('backBtn')) {
      document.getElementById('backBtn').href = '/hr/employee-transfer-history/?emp=' + targetCode;
    }

    const token = localStorage.getItem('authToken');
    const headers = token ? { 'Authorization': 'Token ' + token } : {};

    try {
      let url = '/api/accounts/employees/';
      let allEmp = [];

      while (url) {
        const res = await fetch(url, { headers });
        if (!res.ok) break;
        const data = await res.json();
        const list = Array.isArray(data) ? data : (data.results || []);
        allEmp = allEmp.concat(list);
        url = Array.isArray(data) ? null : data.next;
      }

      if (targetCode) {
        const found = allEmp.find(e => 
          (e.user_id && e.user_id.toLowerCase() === targetCode.toLowerCase()) ||
          (e.id && String(e.id) === String(targetCode))
        );
        if (found) {
          populateEmpFields(found);
        }
      } else if (allEmp.length > 0) {
        populateEmpFields(allEmp[0]);
      }
    } catch (err) {
      console.error('Error fetching employee details:', err);
    }
  }

  function populateEmpFields(emp) {
    const profile = emp.employee_profile || {};
    const employment = emp.employment_details || {};

    const firstName = (emp.first_name || '').trim();
    const lastName = (emp.last_name || '').trim();
    const fullName = [firstName, lastName].filter(Boolean).join(' ').toUpperCase() || emp.user_id || '-';

    if (document.getElementById('employeeName')) {
      document.getElementById('employeeName').value = fullName;
    }
    if (document.getElementById('employeeCode')) {
      document.getElementById('employeeCode').value = emp.user_id || '-';
    }
    if (document.getElementById('employeeDepartment')) {
      const deptSelect = document.getElementById('employeeDepartment');
      const deptVal = employment.department || '';
      deptSelect.innerHTML = `<option value="${deptVal}">${deptVal || '-'}</option>`;
    }
    if (document.getElementById('deputedProject')) {
      const projSelect = document.getElementById('deputedProject');
      const projVal = employment.deputed_project || '';
      projSelect.innerHTML = `<option value="${projVal}">${projVal || '-'}</option>`;
    }
    if (document.getElementById('employeeDesignation')) {
      document.getElementById('employeeDesignation').value = employment.designation || '-';
    }
    if (document.getElementById('doj')) {
      const dateVal = profile.date_of_joining || (emp.created_at ? emp.created_at.split('T')[0] : '');
      document.getElementById('doj').value = dateVal;
    }
    if (document.getElementById('contactNumber1')) {
      document.getElementById('contactNumber1').value = profile.contact_number || '-';
    }
    if (document.getElementById('emailId')) {
      document.getElementById('emailId').value = emp.email || profile.official_email || '-';
    }
  }

  $(document).ready(function() {
    loadEmployeeForForm();

    $('#submit').on('click', async function(e) {
      e.preventDefault();

      const token = localStorage.getItem('authToken');
      if (!token) {
        alert('Authentication required. Please login again.');
        return;
      }

      const employee_code = $('#employeeCode').val();
      const transfer_date = $('#TransferDate').val();
      const present_office = $('#presentOffice').val();
      const new_office = $('#newOffice').val();
      const present_department = $('#presentDepartment').val();
      const new_department = $('#newDepartment').val();
      const present_zone = $('#presentZone').val();
      const new_zone = $('#newZone').val();
      const relieving_date = $('#relievingDate').val();
      const effective_date_from = $('#effDate').val();
      const approved_by = $('#approvedBy').val();
      const remark = $('#othersRemark').val();
      const fileInput = document.getElementById('DocUpload');

      if (!transfer_date || !present_office || !new_office || !present_department || !new_department || !present_zone || !new_zone || !relieving_date || !effective_date_from || !approved_by) {
        alert('Please fill in all required fields.');
        return;
      }

      const formData = new FormData();
      formData.append('employee_code', employee_code);
      formData.append('transfer_date', transfer_date);
      formData.append('present_office', present_office);
      formData.append('new_office', new_office);
      formData.append('present_department', present_department);
      formData.append('new_department', new_department);
      formData.append('present_zone', present_zone);
      formData.append('new_zone', new_zone);
      formData.append('relieving_date', relieving_date);
      formData.append('effective_date_from', effective_date_from);
      formData.append('approved_by', approved_by);
      if (remark) formData.append('remark', remark);
      if (fileInput && fileInput.files.length > 0) {
        formData.append('document', fileInput.files[0]);
      }

      try {
        const res = await fetch('/api/accounts/transfers/', {
          method: 'POST',
          headers: {
            'Authorization': 'Token ' + token
          },
          body: formData
        });

        if (res.ok) {
          alert('Transfer record saved successfully!');
          window.location.href = '/hr/employee-transfer-history/?emp=' + employee_code;
        } else {
          const errorData = await res.json();
          alert('Failed to save transfer record: ' + JSON.stringify(errorData));
        }
      } catch(err) {
        console.error(err);
        alert('An error occurred while saving the record.');
      }
    });
  });
</script>
{% endblock %}
