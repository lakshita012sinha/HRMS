{% extends 'inventory_system/base_inventory.html' %}
{% load static %}
{% block title %}Add Supplier - Inventory System{% endblock %}
{% block content %}
<div class="page-header d-print-none">
    <h4 class="fw-bold mb-3" id="pageTitle">Add New Supplier</h4>
    <ul class="breadcrumbs mb-3">
        <li class="nav-home"><a href="/inventory/dashboard/"><i class="ri-home-3-line"></i></a></li>
        <li class="separator"><i class="ri-arrow-right-s-line"></i></li>
        <li class="nav-item"><a href="/inventory/suppliers/">Vendors</a></li>
        <li class="separator"><i class="ri-arrow-right-s-line"></i></li>
        <li class="nav-item"><span id="breadcrumbLabel">Add New Supplier</span></li>
    </ul>
</div>
<div class="row"><div class="col-md-12"><div class="card"><div class="card-body">
    <div id="alertArea"></div>
    <div class="row">
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Supplier Name</label>
            <input type="text" class="form-control" id="supplierName" placeholder="Enter Supplier Name"></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">GST No. <small class="text-muted">(if Applicable)</small></label>
            <input type="text" class="form-control" id="gstNo" placeholder="Enter GST Number"></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Contact No.</label>
            <input type="text" class="form-control" id="contact" maxlength="10" placeholder="10 digits only"></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Address</label>
            <input type="text" class="form-control" id="address" placeholder="Enter Address"></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">City</label>
            <input type="text" class="form-control" id="city" placeholder="Enter City"></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">State</label>
            <input type="text" class="form-control" id="state" placeholder="Enter State"></div>
        </div>
    </div>
    <div class="pt-3">
        <button type="button" class="btn btn-success btn-sm" id="submitBtn"><strong>Submit</strong></button>
        <a href="/inventory/suppliers/" class="btn btn-secondary btn-sm ms-2">Cancel</a>
    </div>
</div></div></div></div>
{% endblock %}
{% block extra_js %}
<script>
const urlParams=new URLSearchParams(window.location.search);
const editId=urlParams.get('id');
function showAlert(msg,type){type=type||'danger';document.getElementById('alertArea').innerHTML='<div class="alert alert-'+type+' alert-dismissible fade show py-2">'+msg+'<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';window.scrollTo(0,0);}

async function loadRecord(id){
    try{
        const res=await fetch('/api/assets/suppliers/'+id+'/',{headers:{'Authorization':'Token '+token}});
        if(!res.ok)throw new Error('Not found');
        const s=await res.json();
        document.getElementById('pageTitle').textContent='Edit Supplier';
        document.getElementById('breadcrumbLabel').textContent='Edit Supplier';
        document.getElementById('supplierName').value=s.name||'';
        document.getElementById('gstNo').value=s.gst_number||'';
        document.getElementById('contact').value=s.contact_number||'';
        document.getElementById('address').value=s.address||'';
        document.getElementById('city').value=s.city||'';
        document.getElementById('state').value=s.state||'';
    }catch(e){showAlert('Failed to load: '+e.message);}
}

document.addEventListener('DOMContentLoaded',function(){
    if(editId)loadRecord(editId);
    document.getElementById('submitBtn').addEventListener('click',async function(){
        const name=document.getElementById('supplierName').value.trim();
        if(!name){showAlert('Supplier Name is required.');return;}
        const payload={name:name,gst_number:document.getElementById('gstNo').value.trim(),contact_number:document.getElementById('contact').value.trim(),address:document.getElementById('address').value.trim(),city:document.getElementById('city').value.trim(),state:document.getElementById('state').value.trim()};
        const url=editId?'/api/assets/suppliers/'+editId+'/':'/api/assets/suppliers/';
        const method=editId?'PUT':'POST';
        this.disabled=true;this.innerHTML='<strong>Saving...</strong>';
        try{
            const res=await fetch(url,{method:method,headers:{'Authorization':'Token '+token,'Content-Type':'application/json'},body:JSON.stringify(payload)});
            const text=await res.text();var data;try{data=JSON.parse(text);}catch(e){data={error:text};}
            if(res.ok){showAlert(editId?'Updated.':'Supplier added.','success');setTimeout(function(){window.location.href='/inventory/suppliers/';},1000);}
            else{showAlert(data.name&&data.name[0]?data.name[0]:(data.detail||JSON.stringify(data)));}
        }catch(e){showAlert('Error: '+e.message);}
        finally{this.disabled=false;this.innerHTML='<strong>Submit</strong>';}
    });
});
</script>
{% endblock %}
