{% extends 'inventory_system/base_inventory.html' %}
{% load static %}
{% block title %}Add Returned Item - Inventory System{% endblock %}
{% block content %}
<div class="page-header d-print-none">
    <h4 class="fw-bold mb-3" id="pageTitle">Add Returned Item</h4>
    <ul class="breadcrumbs mb-3">
        <li class="nav-home"><a href="/inventory/dashboard/"><i class="ri-home-3-line"></i></a></li>
        <li class="separator"><i class="ri-arrow-right-s-line"></i></li>
        <li class="nav-item"><a href="/inventory/returned/">Returned Items</a></li>
        <li class="separator"><i class="ri-arrow-right-s-line"></i></li>
        <li class="nav-item"><span id="breadcrumbLabel">Add Returned Item</span></li>
    </ul>
</div>
<div class="row"><div class="col-md-12"><div class="card"><div class="card-body">
    <div id="alertArea"></div>
    <div class="row">
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">From Office</label>
            <select class="form-select" id="fromOffice"><option value="">Select</option></select></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">To Office</label>
            <select class="form-select" id="toOffice"><option value="">Select</option></select></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Item</label>
            <select class="form-select" id="item"><option value="">Select</option></select></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Quantity</label>
            <input type="number" class="form-control" id="qty" placeholder="Enter Quantity" min="1"></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Return Date</label>
            <input type="date" class="form-control" id="returnDate"></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Reason <small class="text-muted">(optional)</small></label>
            <textarea id="remarks" class="form-control" rows="3" placeholder="Enter reason.."></textarea></div>
        </div>
    </div>
    <div class="pt-3">
        <button type="button" class="btn btn-success btn-sm" id="submitBtn"><strong>Submit</strong></button>
        <a href="/inventory/returned/" class="btn btn-secondary btn-sm ms-2">Cancel</a>
    </div>
</div></div></div></div>
{% endblock %}
{% block extra_js %}
<script>
const urlParams=new URLSearchParams(window.location.search);
const editId=urlParams.get('id');
function showAlert(msg,type){type=type||'danger';document.getElementById('alertArea').innerHTML='<div class="alert alert-'+type+' alert-dismissible fade show py-2">'+msg+'<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';window.scrollTo(0,0);}

async function loadDropdowns(){
    try{
        const [oRes,iRes]=await Promise.all([
            fetch('/api/assets/zones/',{headers:{'Authorization':'Token '+token}}),
            fetch('/api/assets/assets/',{headers:{'Authorization':'Token '+token}})
        ]);
        const offices=await oRes.json(); const items=await iRes.json();
        const fSel=document.getElementById('fromOffice'); const tSel=document.getElementById('toOffice');
        (Array.isArray(offices)?offices:(offices.results||[])).forEach(function(o){
            fSel.innerHTML+='<option value="'+o.id+'">'+o.name+'</option>';
            tSel.innerHTML+='<option value="'+o.id+'">'+o.name+'</option>';
        });
        const iSel=document.getElementById('item');
        (Array.isArray(items)?items:(items.results||[])).forEach(function(i){iSel.innerHTML+='<option value="'+i.id+'">'+i.name+' ('+i.asset_code+')</option>';});
    }catch(e){console.error(e);}
}

async function loadRecord(id){
    try{
        const res=await fetch('/api/assets/movements/'+id+'/',{headers:{'Authorization':'Token '+token}});
        if(!res.ok)throw new Error('Not found');
        const r=await res.json();
        document.getElementById('pageTitle').textContent='Edit Returned Item';
        document.getElementById('breadcrumbLabel').textContent='Edit';
        document.getElementById('fromOffice').value=r.from_zone||'';
        document.getElementById('toOffice').value=r.to_zone||'';
        document.getElementById('item').value=r.asset||'';
        document.getElementById('qty').value=r.quantity||'';
        document.getElementById('returnDate').value=r.movement_date||'';
        document.getElementById('remarks').value=r.remarks||'';
    }catch(e){showAlert('Failed to load: '+e.message);}
}

document.addEventListener('DOMContentLoaded',async function(){
    await loadDropdowns();
    if(editId)loadRecord(editId);
    document.getElementById('submitBtn').addEventListener('click',async function(){
        const fromOffice=document.getElementById('fromOffice').value;
        const toOffice=document.getElementById('toOffice').value;
        const item=document.getElementById('item').value;
        const qty=document.getElementById('qty').value;
        const date=document.getElementById('returnDate').value;
        if(!fromOffice){showAlert('Please select From Office.');return;}
        if(!item){showAlert('Please select an Item.');return;}
        if(!qty||parseInt(qty)<1){showAlert('Quantity must be at least 1.');return;}
        if(!date){showAlert('Return Date is required.');return;}
        const payload={movement_type:'RETURN',asset:parseInt(item),quantity:parseInt(qty),from_zone:parseInt(fromOffice),movement_date:date,remarks:document.getElementById('remarks').value.trim()};
        if(toOffice)payload.to_zone=parseInt(toOffice);
        const url=editId?'/api/assets/movements/'+editId+'/':'/api/assets/movements/';
        const method=editId?'PUT':'POST';
        this.disabled=true;this.innerHTML='<strong>Saving...</strong>';
        try{
            const res=await fetch(url,{method:method,headers:{'Authorization':'Token '+token,'Content-Type':'application/json'},body:JSON.stringify(payload)});
            const text=await res.text();var data;try{data=JSON.parse(text);}catch(e){data={error:text};}
            if(res.ok){showAlert(editId?'Updated.':'Return added.','success');setTimeout(function(){window.location.href='/inventory/returned/';},1000);}
            else{showAlert(data.non_field_errors&&data.non_field_errors[0]?data.non_field_errors[0]:(data.detail||JSON.stringify(data)));}
        }catch(e){showAlert('Error: '+e.message);}
        finally{this.disabled=false;this.innerHTML='<strong>Submit</strong>';}
    });
});
</script>
{% endblock %}
