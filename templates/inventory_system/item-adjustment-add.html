{% extends 'inventory_system/base_inventory.html' %}
{% load static %}
{% block title %}Add Adjustment - Inventory System{% endblock %}
{% block content %}
<div class="page-header d-print-none">
    <h4 class="fw-bold mb-3" id="pageTitle">Add Item Adjustment</h4>
    <ul class="breadcrumbs mb-3">
        <li class="nav-home"><a href="/inventory/dashboard/"><i class="ri-home-3-line"></i></a></li>
        <li class="separator"><i class="ri-arrow-right-s-line"></i></li>
        <li class="nav-item"><a href="/inventory/adjustments/">Damaged &amp; Lost Items</a></li>
        <li class="separator"><i class="ri-arrow-right-s-line"></i></li>
        <li class="nav-item"><span id="breadcrumbLabel">Add Item Adjustment</span></li>
    </ul>
</div>
<div class="row"><div class="col-md-12"><div class="card"><div class="card-body">
    <div id="alertArea"></div>
    <div class="row">
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Adjustment Type</label>
            <select class="form-select" id="adjustmentType">
                <option value="">Select</option>
                <option value="DAMAGED">Damaged</option>
                <option value="LOST">Lost</option>
                <option value="EXPIRED">Expired</option>
            </select></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Office</label>
            <select class="form-select" id="office"><option value="">Select</option></select></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Category</label>
            <select class="form-select" id="category" onchange="filterItems()"><option value="">Select</option></select></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Item</label>
            <select class="form-select" id="item"><option value="">Select</option></select></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Quantity</label>
            <input type="number" class="form-control" id="qty" placeholder="Enter Quantity" min="1"></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Date</label>
            <input type="date" class="form-control" id="adjDate"></div>
        </div>
        <div class="col-lg-3 col-md-4 col-sm-6">
            <div class="form-group"><label class="form-label">Remark <small class="text-muted">(optional)</small></label>
            <textarea id="remark" class="form-control" rows="3" placeholder="Enter remark.."></textarea></div>
        </div>
    </div>
    <div class="pt-3">
        <button type="button" class="btn btn-success btn-sm" id="submitBtn"><strong>Submit</strong></button>
        <a href="/inventory/adjustments/" class="btn btn-secondary btn-sm ms-2">Cancel</a>
    </div>
</div></div></div></div>
{% endblock %}
{% block extra_js %}
<script>
const urlParams=new URLSearchParams(window.location.search);
const editId=urlParams.get('id');
let allItems=[];
function showAlert(msg,type){type=type||'danger';document.getElementById('alertArea').innerHTML='<div class="alert alert-'+type+' alert-dismissible fade show py-2">'+msg+'<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';window.scrollTo(0,0);}

async function loadDropdowns(){
    try{
        const [oRes,cRes,iRes]=await Promise.all([
            fetch('/api/assets/zones/',{headers:{'Authorization':'Token '+token}}),
            fetch('/api/assets/categories/',{headers:{'Authorization':'Token '+token}}),
            fetch('/api/assets/assets/',{headers:{'Authorization':'Token '+token}})
        ]);
        const offices=await oRes.json(); const cats=await cRes.json(); const items=await iRes.json();
        const oSel=document.getElementById('office');
        (Array.isArray(offices)?offices:(offices.results||[])).forEach(function(o){oSel.innerHTML+='<option value="'+o.id+'">'+o.name+'</option>';});
        const cSel=document.getElementById('category');
        (Array.isArray(cats)?cats:(cats.results||[])).forEach(function(c){cSel.innerHTML+='<option value="'+c.id+'">'+c.name+'</option>';});
        allItems=Array.isArray(items)?items:(items.results||[]);
        filterItems();
    }catch(e){console.error(e);}
}

function filterItems(){
    const catId=document.getElementById('category').value;
    const iSel=document.getElementById('item');
    const cur=iSel.value;
    iSel.innerHTML='<option value="">Select</option>';
    allItems.filter(function(i){return !catId||String(i.category)===catId;}).forEach(function(i){
        iSel.innerHTML+='<option value="'+i.id+'">'+i.name+' ('+i.asset_code+')</option>';
    });
    if(cur)iSel.value=cur;
}

async function loadRecord(id){
    try{
        const res=await fetch('/api/assets/adjustments/'+id+'/',{headers:{'Authorization':'Token '+token}});
        if(!res.ok)throw new Error('Not found');
        const r=await res.json();
        document.getElementById('pageTitle').textContent='Edit Item Adjustment';
        document.getElementById('breadcrumbLabel').textContent='Edit';
        document.getElementById('adjustmentType').value=r.adjustment_type||'';
        document.getElementById('office').value=r.office||'';
        document.getElementById('item').value=r.item||'';
        document.getElementById('qty').value=r.quantity||'';
        document.getElementById('adjDate').value=r.adjustment_date||'';
        document.getElementById('remark').value=r.remark||'';
    }catch(e){showAlert('Failed to load: '+e.message);}
}

document.addEventListener('DOMContentLoaded',async function(){
    await loadDropdowns();
    if(editId)loadRecord(editId);
    document.getElementById('submitBtn').addEventListener('click',async function(){
        const adjType=document.getElementById('adjustmentType').value;
        const office=document.getElementById('office').value;
        const item=document.getElementById('item').value;
        const qty=document.getElementById('qty').value;
        const adjDate=document.getElementById('adjDate').value;
        if(!adjType){showAlert('Please select Adjustment Type.');return;}
        if(!item){showAlert('Please select an Item.');return;}
        if(!qty||parseInt(qty)<1){showAlert('Quantity must be at least 1.');return;}
        if(!adjDate){showAlert('Date is required.');return;}
        const payload={adjustment_type:adjType,item:parseInt(item),quantity:parseInt(qty),adjustment_date:adjDate,remark:document.getElementById('remark').value.trim()};
        if(office)payload.office=parseInt(office);
        const url=editId?'/api/assets/adjustments/'+editId+'/':'/api/assets/adjustments/';
        const method=editId?'PUT':'POST';
        this.disabled=true;this.innerHTML='<strong>Saving...</strong>';
        try{
            const res=await fetch(url,{method:method,headers:{'Authorization':'Token '+token,'Content-Type':'application/json'},body:JSON.stringify(payload)});
            const text=await res.text();var data;try{data=JSON.parse(text);}catch(e){data={error:text};}
            if(res.ok){showAlert(editId?'Updated.':'Added.','success');setTimeout(function(){window.location.href='/inventory/adjustments/';},1000);}
            else{showAlert(data.adjustment_type&&data.adjustment_type[0]?data.adjustment_type[0]:(data.detail||JSON.stringify(data)));}
        }catch(e){showAlert('Error: '+e.message);}
        finally{this.disabled=false;this.innerHTML='<strong>Submit</strong>';}
    });
});
</script>
{% endblock %}
